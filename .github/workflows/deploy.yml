name: Deploy to CloudPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: SSH and Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 37.27.210.123
          username: kosova
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            export PATH=/home/kosova/.nvm/versions/node/v22.23.3/bin:$PATH
            
            cd /home/kosova/htdocs/kosova.report
            git config --global --add safe.directory /home/kosova/htdocs/kosova.report
            git fetch --all
            git reset --hard origin/main
            
            # Asennetaan paketit
            npm install --legacy-peer-deps