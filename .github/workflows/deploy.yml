name: Deploy to CloudPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: SSH and Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 37.27.210.123
          username: kosova
          password: ${{ secrets.SSH_PASSWORD }} # <-- Vaihdettu avain salasanaksi!
          port: 22
          script: |
            export PATH=/home/kosova/.nvm/versions/node/v22.23.3/bin:$PATH
            
            cd /home/kosova/htdocs/kosova.report
            git config --global --add safe.directory /home/kosova/htdocs/kosova.report
            git fetch --all
            git reset --hard origin/main
            
            npm install --legacy-peer-deps
            npm run build
            pm2 restart kosova-report || pm2 start npm --name "kosova-report" -- run start -- -p 3067
            pm2 save
