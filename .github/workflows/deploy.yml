name: Deploy to CloudPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: SSH and Deploy to Server
        uses: appleboy/ssh-action@master
        with:
          host: 37.27.210.123
          username: kosova # VAIHDA tähän CloudPanelin antama todellinen Site User -tunnuksesi
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd /home/site-user/htdocs/kosova.report
            git pull origin main
            npm install
            npm run build
            pm2 restart kosova-report || pm2 start npm --name "kosova-report" -- run start -- -p 3067
            pm2 save
