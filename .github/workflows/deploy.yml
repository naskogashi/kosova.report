name: Deploy to CloudPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: SSH and Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 37.27.210.123
          username: kosova
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd /home/kosova/htdocs/kosova.report
            git fetch --all
            git reset --hard origin/main
            npm install
            npm run build
            pm2 restart kosova-report || pm2 start npm --name "kosova-report" -- run start -- -p 3067
            pm2 save