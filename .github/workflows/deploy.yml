name: Deploy to CloudPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: SSH and Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 37.27.210.123
          username: kosova
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            # Pakotetaan NVM ja Node.js polut käyttöön tausta-ajossa
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            export PATH=$PATH:$HOME/.nvm/versions/node/$(nvm current)/bin:$HOME/.config/composer/vendor/bin:/usr/local/bin

            # Siirrytään kansioon ja päivitetään koodi GitHubista
            cd /home/kosova/htdocs/kosova.report
            git config --global --add safe.directory /home/kosova/htdocs/kosova.report
            git fetch --all
            git reset --hard origin/main

            # Ajetaan asennukset ja tuotantorakennus
            npm install
            npm run build

            # Käynnistetään Next.js PM2-prosessinhallintaan portille 3067
            ~/.nvm/versions/node/$(nvm current)/bin/pm2 restart kosova-report || ~/.nvm/versions/node/$(nvm current)/bin/pm2 start npm --name "kosova-report" -- run start -- -p 3067
            ~/.nvm/versions/node/$(nvm current)/bin/pm2 save